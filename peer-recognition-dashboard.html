<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer Recognition Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .controls {
            background: #f8fafc;
            padding: 20px 30px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .quarter-selector {
            display: flex;
            gap: 10px;
        }

        .quarter-btn {
            padding: 10px 20px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .quarter-btn.active {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        .quarter-btn:hover {
            border-color: #4f46e5;
            transform: translateY(-2px);
        }

        .search-box {
            flex: 1;
            max-width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f8fafc;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #4f46e5;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #64748b;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .employees-grid {
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .employee-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .employee-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .employee-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
        }

        .employee-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .employee-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .employee-info h3 {
            font-size: 1.2rem;
            color: #1e293b;
            margin-bottom: 5px;
        }

        .employee-id {
            color: #64748b;
            font-size: 0.9rem;
            font-family: monospace;
        }

        .employee-details {
            margin-top: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .detail-label {
            color: #64748b;
            font-weight: 500;
        }

        .detail-value {
            color: #1e293b;
            font-weight: 600;
        }

        .recognition-badge {
            display: inline-block;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 10px;
        }

        .department-tag {
            display: inline-block;
            background: #e0e7ff;
            color: #4338ca;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
            font-size: 1.1rem;
        }

        .quarter-info {
            background: white;
            margin: 20px 30px;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #4f46e5;
        }

        .quarter-info h2 {
            color: #1e293b;
            margin-bottom: 10px;
        }

        .quarter-info p {
            color: #64748b;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .quarter-selector {
                justify-content: center;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                padding: 20px;
            }

            .employees-grid {
                grid-template-columns: 1fr;
                padding: 20px;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 Peer Recognition Dashboard</h1>
            <p>Celebrating excellence and achievements across all quarters</p>
        </div>

        <div class="controls">
            <div class="quarter-selector">
                <button class="quarter-btn active" data-quarter="all">All Quarters</button>
                <button class="quarter-btn" data-quarter="Q1">Q1 2024</button>
                <button class="quarter-btn" data-quarter="Q2">Q2 2024</button>
                <button class="quarter-btn" data-quarter="Q3">Q3 2024</button>
                <button class="quarter-btn" data-quarter="Q4">Q4 2024</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search employees...">
            </div>
        </div>

        <div class="quarter-info" id="quarterInfo">
            <h2>All Quarters Overview</h2>
            <p>Displaying recognition data for all quarters of 2024. Use the quarter filters to view specific periods.</p>
        </div>

        <div class="stats" id="statsContainer">
            <div class="stat-card">
                <div class="stat-number" id="totalEmployees">0</div>
                <div class="stat-label">Total Employees</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalDepartments">0</div>
                <div class="stat-label">Departments</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalRecognitions">0</div>
                <div class="stat-label">Recognitions</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="currentQuarter">All</div>
                <div class="stat-label">Current Quarter</div>
            </div>
        </div>

        <div class="employees-grid" id="employeesContainer">
            <!-- Employee cards will be dynamically generated here -->
        </div>
    </div>

    <script>
        // Sample employee data with quarterly recognition information
        const employeeData = [
            {
                id: "EMP001",
                name: "Alice Johnson",
                designation: "Senior Software Engineer",
                department: "Engineering",
                quarter: "Q1",
                recognitions: 5,
                achievements: ["Code Quality Award", "Team Player"]
            },
            {
                id: "EMP002",
                name: "Bob Smith",
                designation: "Product Manager",
                department: "Product",
                quarter: "Q1",
                recognitions: 3,
                achievements: ["Innovation Award"]
            },
            {
                id: "EMP003",
                name: "Carol Williams",
                designation: "UX Designer",
                department: "Design",
                quarter: "Q1",
                recognitions: 4,
                achievements: ["Design Excellence"]
            },
            {
                id: "EMP004",
                name: "David Brown",
                designation: "DevOps Engineer",
                department: "Engineering",
                quarter: "Q2",
                recognitions: 6,
                achievements: ["Infrastructure Hero", "Performance Optimizer"]
            },
            {
                id: "EMP005",
                name: "Emma Davis",
                designation: "Marketing Manager",
                department: "Marketing",
                quarter: "Q2",
                recognitions: 4,
                achievements: ["Campaign Excellence"]
            },
            {
                id: "EMP006",
                name: "Frank Wilson",
                designation: "Data Scientist",
                department: "Analytics",
                quarter: "Q2",
                recognitions: 7,
                achievements: ["Data Insights Master", "ML Innovation"]
            },
            {
                id: "EMP007",
                name: "Grace Miller",
                designation: "HR Specialist",
                department: "Human Resources",
                quarter: "Q3",
                recognitions: 3,
                achievements: ["Employee Engagement"]
            },
            {
                id: "EMP008",
                name: "Henry Taylor",
                designation: "Frontend Developer",
                department: "Engineering",
                quarter: "Q3",
                recognitions: 5,
                achievements: ["UI/UX Excellence", "Performance Optimization"]
            },
            {
                id: "EMP009",
                name: "Ivy Anderson",
                designation: "Sales Director",
                department: "Sales",
                quarter: "Q3",
                recognitions: 8,
                achievements: ["Top Performer", "Client Relations", "Revenue Growth"]
            },
            {
                id: "EMP010",
                name: "Jack Thomas",
                designation: "QA Engineer",
                department: "Quality Assurance",
                quarter: "Q4",
                recognitions: 4,
                achievements: ["Bug Hunter", "Testing Excellence"]
            },
            {
                id: "EMP011",
                name: "Kelly Jackson",
                designation: "Content Manager",
                department: "Marketing",
                quarter: "Q4",
                recognitions: 3,
                achievements: ["Content Strategy"]
            },
            {
                id: "EMP012",
                name: "Leo White",
                designation: "Backend Developer",
                department: "Engineering",
                quarter: "Q4",
                recognitions: 6,
                achievements: ["API Design Master", "Scalability Expert"]
            },
            {
                id: "EMP013",
                name: "Mia Harris",
                designation: "Business Analyst",
                department: "Operations",
                quarter: "Q1",
                recognitions: 4,
                achievements: ["Process Improvement"]
            },
            {
                id: "EMP014",
                name: "Noah Martin",
                designation: "Security Engineer",
                department: "Security",
                quarter: "Q2",
                recognitions: 5,
                achievements: ["Security Champion", "Vulnerability Detection"]
            },
            {
                id: "EMP015",
                name: "Olivia Garcia",
                designation: "Finance Manager",
                department: "Finance",
                quarter: "Q3",
                recognitions: 3,
                achievements: ["Budget Optimization"]
            }
        ];

        let currentQuarterFilter = 'all';
        let filteredData = [...employeeData];

        // Initialize the dashboard
        function initDashboard() {
            setupEventListeners();
            renderEmployees(employeeData);
            updateStats(employeeData);
        }

        // Setup event listeners
        function setupEventListeners() {
            // Quarter filter buttons
            const quarterBtns = document.querySelectorAll('.quarter-btn');
            quarterBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    quarterBtns.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentQuarterFilter = e.target.dataset.quarter;
                    filterAndRender();
                    updateQuarterInfo(currentQuarterFilter);
                });
            });

            // Search input
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                filterAndRender();
            });
        }

        // Filter and render data
        function filterAndRender() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            filteredData = employeeData.filter(employee => {
                const matchesQuarter = currentQuarterFilter === 'all' || employee.quarter === currentQuarterFilter;
                const matchesSearch = 
                    employee.name.toLowerCase().includes(searchTerm) ||
                    employee.id.toLowerCase().includes(searchTerm) ||
                    employee.designation.toLowerCase().includes(searchTerm) ||
                    employee.department.toLowerCase().includes(searchTerm);
                
                return matchesQuarter && matchesSearch;
            });

            renderEmployees(filteredData);
            updateStats(filteredData);
        }

        // Render employee cards
        function renderEmployees(employees) {
            const container = document.getElementById('employeesContainer');
            
            if (employees.length === 0) {
                container.innerHTML = '<div class="no-results">No employees found matching your criteria.</div>';
                return;
            }

            container.innerHTML = employees.map(employee => \`
                <div class="employee-card">
                    <div class="employee-header">
                        <div class="employee-avatar">
                            \${employee.name.split(' ').map(n => n[0]).join('')}
                        </div>
                        <div class="employee-info">
                            <h3>\${employee.name}</h3>
                            <div class="employee-id">\${employee.id}</div>
                        </div>
                    </div>
                    <div class="employee-details">
                        <div class="detail-row">
                            <span class="detail-label">Designation:</span>
                            <span class="detail-value">\${employee.designation}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Department:</span>
                            <span class="detail-value">
                                <span class="department-tag">\${employee.department}</span>
                            </span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Quarter:</span>
                            <span class="detail-value">\${employee.quarter}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Recognitions:</span>
                            <span class="detail-value">\${employee.recognitions}</span>
                        </div>
                    </div>
                    <div class="recognition-badge">
                        \${employee.achievements.join(' • ')}
                    </div>
                </div>
            \`).join('');
        }

        // Update statistics
        function updateStats(employees) {
            const totalEmployees = employees.length;
            const totalDepartments = new Set(employees.map(emp => emp.department)).size;
            const totalRecognitions = employees.reduce((sum, emp) => sum + emp.recognitions, 0);
            
            document.getElementById('totalEmployees').textContent = totalEmployees;
            document.getElementById('totalDepartments').textContent = totalDepartments;
            document.getElementById('totalRecognitions').textContent = totalRecognitions;
            document.getElementById('currentQuarter').textContent = currentQuarterFilter === 'all' ? 'All' : currentQuarterFilter;
        }

        // Update quarter information
        function updateQuarterInfo(quarter) {
            const quarterInfo = document.getElementById('quarterInfo');
            const quarterDescriptions = {
                'all': {
                    title: 'All Quarters Overview',
                    description: 'Displaying recognition data for all quarters of 2024. Use the quarter filters to view specific periods.'
                },
                'Q1': {
                    title: 'Q1 2024 Recognition',
                    description: 'January - March 2024: Focus on foundation building and team establishment.'
                },
                'Q2': {
                    title: 'Q2 2024 Recognition',
                    description: 'April - June 2024: Growth phase with increased productivity and innovation.'
                },
                'Q3': {
                    title: 'Q3 2024 Recognition',
                    description: 'July - September 2024: Peak performance period with major project deliveries.'
                },
                'Q4': {
                    title: 'Q4 2024 Recognition',
                    description: 'October - December 2024: Year-end achievements and strategic planning.'
                }
            };

            const info = quarterDescriptions[quarter];
            quarterInfo.innerHTML = \`
                <h2>\${info.title}</h2>
                <p>\${info.description}</p>
            \`;
        }

        // Initialize the dashboard when the page loads
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
